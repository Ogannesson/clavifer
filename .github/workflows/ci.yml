name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run openapi:check
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l cmd/)"
      - run: go vet ./...
      - run: go test ./...
      - run: npm run test:e2e
      # Writes to the real Windows credential store, so it has no Linux counterpart.
      - if: runner.os == 'Windows'
        run: npm run test:system
